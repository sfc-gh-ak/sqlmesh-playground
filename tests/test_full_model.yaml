# Tests for sqlmesh_example.full_model
# Verifies COUNT(DISTINCT id) aggregation grouped by item_id

test_example_full_model:
  model: sqlmesh_example.full_model
  inputs:
    sqlmesh_example.incremental_model:
      rows:
        - id: 1
          item_id: 1
        - id: 2
          item_id: 1
        - id: 3
          item_id: 2
  outputs:
    query:
      rows:
        - item_id: 1
          num_orders: 2
        - item_id: 2
          num_orders: 1

test_full_model_deduplicates_same_id:
  model: sqlmesh_example.full_model
  inputs:
    sqlmesh_example.incremental_model:
      rows:
        - id: 1
          item_id: 1
        - id: 1
          item_id: 1  # duplicate id — COUNT DISTINCT should count as 1
        - id: 2
          item_id: 1
  outputs:
    query:
      rows:
        - item_id: 1
          num_orders: 2  # id 1 and id 2, not 3

test_full_model_single_order_per_item:
  model: sqlmesh_example.full_model
  inputs:
    sqlmesh_example.incremental_model:
      rows:
        - id: 1
          item_id: 10
        - id: 2
          item_id: 20
        - id: 3
          item_id: 30
  outputs:
    query:
      rows:
        - item_id: 10
          num_orders: 1
        - item_id: 20
          num_orders: 1
        - item_id: 30
          num_orders: 1
